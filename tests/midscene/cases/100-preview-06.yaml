cases:
  - name: PREVIEW-06 Read custom JSX and TSX entry previews
    tags:
      [
        original-preview-render,
        replacement-batch-4,
        replacement-preview-prompt,
        remote-preview-virtual-regression,
      ]
    steps:
      - app.open: { fixture: plugin-preview-custom-entry, path: /guide/ }
      - aiAssert: The first example's right gray preview pane displays a black Hello World JSX line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
      - aiAct: Scroll the Guide article to the second example showing Hello World TSX. Stay on this article.
      - aiAssert: The second example's right gray preview pane displays a black Hello World TSX line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
      - aiAct: Scroll the Guide article to the third example showing Hello World External. Stay on this article.
      - aiAssert: The third example's right gray preview pane displays a black Hello World External line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
