cases:
  - name: AUDIT-12 Reveal the social link preview
    tags: [replacement-final-content, remote-regression]
    steps:
      - app.open: { fixture: basic, path: / }
      - aiAssert: No illustrated mascot popup is visible beneath the GitHub social icon in the top navigation.
      - aiAct: Reveal the GitHub social preview by hovering on the rightmost Octocat icon, immediately to the right of the sun/theme icon at the far-right end of the header. The Search field is a different control to its left. Keep the pointer on the Octocat and wait until the white popup below it fully opens and its colored mascot is clearly visible. A faint fading image is not the completed state; if it fades, move back onto the Octocat. Finish while the fully visible popup remains open. Do not click.
      - aiAssert: A small white rounded popup beneath the GitHub social icon contains an illustrated Rspress mascot, separate from the article content.
      - aiAct: Move the pointer away from the GitHub icon onto the Hello world article heading without clicking.
      - aiAssert: The mascot popup beneath the GitHub social icon is no longer visible.
