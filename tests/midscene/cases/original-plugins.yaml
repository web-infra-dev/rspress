cases:
  - name: PLUGIN-01 Search generated API documentation
    tags: [shard-1, original-api]
    steps:
      - app.open: { fixture: plugin-api-docgen/locales, path: / }
      - aiAct: Open search, enter disabled, then open the matching API documentation result.
      - aiAssert: The generated API table is visible and contains the disabled property with its description Whether to disable the button.
  - name: PLUGIN-02 Switch generated API documentation language
    tags: [shard-1, original-api]
    steps:
      - app.open: { fixture: plugin-api-docgen/locales, path: / }
      - aiAct: Switch to 简体中文 using the language selector, then find the API table in the article.
      - aiAssert: The API table has Chinese column headings 属性 and 说明, with disabled and size properties.
  - name: PLUGIN-03 Read component previews while changing the theme
    tags: [shard-1, original-preview]
    steps:
      - app.open: { fixture: plugin-preview, path: /mixed }
      - aiAct: Stay on the Mixed article. Set the reading theme to dark using the top appearance switch, then bring the first rendered This is a component preview into view. Do not navigate to another article or use search.
      - aiAssert: The Mixed article uses a dark reading theme and the rendered preview displays This is a component.
      - aiAct: Stay on the Mixed article. Set the reading theme to light using the appearance switch, then bring the same rendered This is a component preview into view.
      - aiAssert: The Mixed article uses a light reading theme and the rendered preview displays This is a component.
  - name: PLUGIN-04 Read a Vue component preview
    tags: [shard-1, original-custom-preview]
    steps:
      - app.open: { fixture: plugin-preview-custom-entry, path: / }
      - aiAct: Use documentation navigation to open the Vue guide.
      - aiAssert: The rendered Vue preview displays Hello World VUE.
  - name: PLUGIN-05 Inspect a Twoslash type tooltip
    tags: [shard-1, original-twoslash]
    steps:
      - app.open: { fixture: plugin-twoslash, path: / }
      - aiAct: In Extract type, hover over the marked msg variable to open its type information.
      - aiAssert: A type information popup for msg is visible.
  - name: PLUGIN-06 Search single-entry generated API documentation
    tags: [shard-1, original-single-api]
    steps:
      - app.open: { fixture: plugin-api-docgen/single, path: /zh/ }
      - aiAct: Open documentation search, search for disabled, and open the matching generated API result.
      - aiAssert: The generated API table displays 属性, 说明, 类型, 默认值, disabled, and size, with Whether to disable the button in its description.
