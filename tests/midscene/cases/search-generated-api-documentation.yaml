cases:
  - name: PLUGIN-01 Search generated API documentation
    tags: [original-api, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-api-docgen/locales, path: / }
      - aiAct: Open search and enter disabled. Stay in the search dialog.
      - aiAssert: Exactly one result for the generated API documentation is listed.
      - aiAct: Open that generated API documentation result and bring its Button table into view.
      - aiAssert: The Button API table displays Property, Description, Type, and Default Value columns. The disabled row has Whether to disable the button, - This is extra line a, - This is extra line b, a type that includes boolean (the optional property may also include undefined), and a dash default. The size row has Type of Button, a type containing the four string options "mini", "small", "default", and "large" (the optional property may also include undefined), and the default value 'default'.
