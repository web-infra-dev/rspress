cases:
  - name: COMPAT-01 Interact with documentation using React 18
    tags: [original-compatibility, replacement-batch-2]
    steps:
      - app.open: { fixture: react-18, path: / }
      - aiAct: Open search, search for Hello world, and open the matching result.
      - aiAssert: The Hello world article is visible and contains react 18.
  - name: COMPAT-02 Interact with documentation using React 19
    tags: [original-compatibility, replacement-batch-2]
    steps:
      - app.open: { fixture: react-19, path: / }
      - aiAct: Open search, search for Hello world, and open the matching result.
      - aiAssert: The Hello world article is visible and contains react 19.
  - name: COMPAT-03 Interact with React Router DOM 6
    tags: [original-compatibility, replacement-batch-2]
    steps:
      - app.open: { fixture: react-router-dom-6, path: / }
      - aiAct: Open search, search for Hello world, and open the matching result.
      - aiAssert: The Hello world article is visible and contains react-router-dom 6.
  - name: COMPAT-04 Recover from a missing page with React 18
    tags: [original-compatibility-fallback]
    steps:
      - app.open: { fixture: react-18, path: /404 }
      - aiAct: Bring the 404 page and its home recovery link into view.
      - aiAssert: The page displays a 404 message.
      - aiAct: Click the Take me home recovery button below the 404 message and wait for the Hello world article to replace the error page. Do not click the top-left site title, enter a URL, or use search. Stop when the article is visible.
      - aiAssert: The Hello world article is visible and contains react 18.
  - name: COMPAT-05 Recover from a missing page with React 19
    tags: [original-compatibility-fallback]
    steps:
      - app.open: { fixture: react-19, path: /404 }
      - aiAct: Bring the 404 page and its home recovery link into view.
      - aiAssert: The page displays a 404 message.
      - aiAct: Follow the home recovery link.
      - aiAssert: The Hello world article is visible and contains react 19.
  - name: COMPAT-06 Recover from a missing page with React Router DOM 6
    tags: [original-compatibility-fallback]
    steps:
      - app.open: { fixture: react-router-dom-6, path: /404 }
      - aiAct: Bring the 404 page and its home recovery link into view.
      - aiAssert: The page displays a 404 message.
      - aiAct: Click the Take me home button in the 404 page body. Wait until the 404 message is replaced by the Hello world article containing react-router-dom 6. Do not use the Open suspended page navigation link or search. A page still showing PAGE NOT FOUND is not the destination.
      - aiAssert: The Hello world article is visible and contains react-router-dom 6.
