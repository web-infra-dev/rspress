cases:
  - name: SEARCH-08 Find Japanese content
    tags:
      [
        stability-regression,
        original-localized-search,
        replacement-batch-3,
        remote-search-static-regression,
        remote-japanese-regression,
      ]
    steps:
      - app.open: { fixture: search-i18n, path: / }
      - aiAct: Switch the site language to 日本語 using the language menu, then open search. Leave the empty search input visible.
      - aiInput:
          { prompt: The search input in the open search dialog., value: ご }
      - search.expectResults:
          {
            query: ご,
            count: 1,
            firstContains: にほんご,
            firstStartsWith: にほんご,
            firstEndsWith: ページ,
          }
      - aiAssert: The search dialog shows one Japanese result row with matching characters highlighted. The selected row may have a blue background.
      - aiInput:
          {
            prompt: The search input in the open search dialog.,
            value: ヘッダー,
          }
      - search.expectResults:
          { query: ヘッダー, count: 2, firstContains: ヘッダー }
      - aiAssert: The search dialog shows two Japanese result rows with matching characters highlighted.
      - aiInput:
          { prompt: The search input in the open search dialog., value: す }
      - search.expectResults:
          {
            query: す,
            count: 1,
            firstContains: できます,
            firstStartsWith: できます,
            firstEndsWith: できます,
          }
      - aiAssert: The search dialog shows one result row with the matching character highlighted at the end of its main text. The smaller page breadcrumb below is not a second result.
      - aiInput:
          { prompt: The search input in the open search dialog., value: さ }
      - search.expectResults:
          { query: さ, count: 1, firstContains: さい, firstEndsWith: さい }
      - aiAssert: The search dialog shows one result row. Its long Japanese text wraps across lines, with matching characters highlighted above the smaller page breadcrumb.
