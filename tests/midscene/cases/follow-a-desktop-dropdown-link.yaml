cases:
  - name: NAV-01 Follow a desktop dropdown link
    tags:
      [
        stability-regression,
        navigation-dropdown-regression,
        original-nav,
        replacement-final-existing,
      ]
    steps:
      - app.open: { fixture: nav-link-items, path: / }
      - aiAssert: The top navigation displays OnlyLink, OnlyItems, ItemsAndLink, and NestedItems, with dropdown contents initially hidden.
      - aiHover: The NestedItems dropdown trigger at the right end of the top navigation.
      - aiWaitFor: The NestedItems dropdown shows the Level3Item1 and Level3Item2 links together in a flat list.
      - aiTap: The Level3Item1 link in the open NestedItems dropdown, not Level3Item2.
      - app.expectLocation:
          { path: /nested-items/level3-item1.html, heading: Level 3 item 1 }
      - aiAssert: The article heading is Level 3 item 1.
