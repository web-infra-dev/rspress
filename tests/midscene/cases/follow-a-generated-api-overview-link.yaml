cases:
  - name: CONTENT-01 Follow a generated API overview link
    tags:
      [
        original-overview,
        replacement-batch-3-overviews,
        replacement-final-existing,
        ci-failure-regression,
      ]
    steps:
      - app.open: { fixture: auto-nav-sidebar, path: /api/index.html }
      - aiAct: Scroll only the main document to show the Config overview group with its Basic config, Theme config, Build config rows and the three cards below. Stay on the current API Overview page. Do not click Config in the sidebar, any card, any heading, or any link; those navigate to a different overview. Stop once the group is visible.
      - aiAssert: In the main overview content, Config has three wide rows titled Basic config, Theme config, and Build config from top to bottom, followed by cards titled Front matter config, Extname config, and Nested from left to right. The rows include links root, logoText, nav, sidebar, builderConfig, Default config, markdown, and markdown.remarkPlugins. Nested is a directory card, not an article. Ignore the separate sidebar ordering.
      - aiAct: Scroll only the main document to show both Components and Runtime API entries in the Client API overview group. Do not click any sidebar entry, heading, card, or link. Stay on the current API Overview page.
      - aiAssert: The Client API overview contains a Components row with Usage and Example links, followed by a separate card titled Runtime API. Runtime API is a title-only card in this overview.
      - aiAct: Scroll down only in the wide main article to the overview entries below Client API. Bring the Commands entry with its rspress dev and rspress build links, Single, Section a, and Section b into view in the article. The matching labels in the narrow left sidebar do not count; do not scroll that sidebar. Stay on API Overview without clicking any heading, card, or link. Finish when these entries and the two command links are visible in the main article.
      - aiAssert: Commands, Single, Section a, and Section b appear as overview sections with corresponding article entries; the Commands entry offers rspress dev and rspress build.
      - aiAct: In the API overview article, follow the Commands link. Do not use the sidebar or search.
      - aiAssert: The Commands article is open with rspress dev and rspress build sections.
