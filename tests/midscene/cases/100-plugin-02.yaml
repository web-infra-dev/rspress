cases:
  - name: PLUGIN-02 Switch generated API documentation language
    tags: [original-api, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-api-docgen/locales, path: / }
      - aiAct: Switch to 简体中文 using the language selector, then find the API table in the article.
      - aiAssert: The Button API table displays 属性, 说明, 类型, 默认值 columns. The disabled row has Whether to disable the button, - This is extra line a, - This is extra line b, the type boolean | undefined, and a dash default. The size row has Type of Button, the type "mini" | "small" | "default" | "large" | undefined, and the default value 'default'.
