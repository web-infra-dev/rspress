cases:
  - name: EXTRA-05 Interact with BrowserOnly components after production hydration
    tags:
      [original-additional, migration-regression, replacement-final-existing]
    steps:
      - app.open: { fixture: with-base, mode: production, path: /base/en/ }
      - aiAct: Bring the BrowserOnly demonstration into view without activating any button. Locate the synchronous Increment button and the asynchronous row with Update and Resolve.
      - aiAssert: The synchronous counter reads Sync 0 beside Increment. The asynchronous row contains Update and Resolve buttons and shows Async fallback initial.
      - aiAct: Click the large BrowserOnly section heading in the main article (not the On this page link) to set the keyboard navigation starting point. Press Tab once to focus the first control below it, Increment, then Space once. Stop when Sync 1 appears, leaving focus on Increment. Do not click the tightly joined button/output row.
      - aiAssert: The BrowserOnly row shows the Increment button followed by Sync 1; its counter value is 1.
      - aiAct: Increment retains keyboard focus. Press Tab three times to move past Mount BrowserOnly and Update to Resolve, then press Space once. Wait for Async initial without fallback. Do not click the tightly joined row text or operate the later demonstrations.
      - aiAssert: The asynchronous row with Update and Resolve displays Async initial without fallback.
      - aiAct: Resolve retains keyboard focus. Press Shift+Tab once to focus Update and press Space once. Then press Tab once to return to Resolve and press Space once to finish the pending update. Wait for Async updated without fallback; do not activate the later demonstrations.
      - aiAssert: The asynchronous row with Update and Resolve displays Async updated without fallback, rather than Async initial.
