cases:
  - name: EXTRA-05 Interact with BrowserOnly components after production hydration
    tags:
      [original-additional, migration-regression, replacement-final-existing]
    steps:
      - app.open: { fixture: with-base, mode: production, path: /base/en/ }
      - aiAct: Bring the BrowserOnly demonstration into view. In the asynchronous row containing Update and Resolve, click Resolve once to complete the initial load, and wait until Async initial appears without fallback. Do not click Increment, Update, Mount BrowserOnly, or any of the later demonstrations.
      - aiAssert: The synchronous counter reads Sync 0 beside Increment, and the asynchronous row with Update and Resolve displays Async initial without fallback.
      - aiAct: In the synchronous BrowserOnly demonstration, click the Increment button once and stop when its counter reads Sync 1. Click the button text, not the Sync output or Mount BrowserOnly. Do not operate the asynchronous row yet.
      - aiAssert: The BrowserOnly row shows the Increment button followed by Sync 1; its counter value is 1. The button label may touch the output text.
      - aiAct: In the asynchronous BrowserOnly row containing Update and Resolve, click Update once. Then click Resolve once in that same row to finish the pending updated output. Wait until this row displays Async updated without fallback. Do not click buttons in the later async race or lazy content demonstrations.
      - aiAssert: The asynchronous output beside Update and Resolve displays Async updated without fallback, rather than Async initial.
