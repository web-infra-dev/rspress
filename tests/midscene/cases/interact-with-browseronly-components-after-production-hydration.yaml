cases:
  - name: EXTRA-05 Interact with BrowserOnly components after production hydration
    tags:
      [original-additional, migration-regression, replacement-final-existing]
    steps:
      - app.open: { fixture: with-base, mode: production, path: /base/en/ }
      - aiAssert: The BrowserOnly demonstration displays Sync 0 beside the Increment label, and Async fallback initial beside the Update and Resolve labels. These controls are unstyled inline text; no button border or background is required.
      - aiAct: Click the large BrowserOnly section heading in the main article (not the On this page link) to set the keyboard navigation starting point. Press Tab once to focus the first control below it, Increment, then Space once. Stop when Sync 1 appears, leaving focus on Increment. Do not click the tightly joined button/output row.
      - aiAssert: The BrowserOnly row shows the Increment label followed by Sync 1; its counter value is 1. The control is unstyled inline text.
      - aiAct: Click the large BrowserOnly section heading in the main article to reset the keyboard navigation starting point. Press Tab four times to reach Resolve (the controls below the heading are Increment, Mount BrowserOnly, Update, Resolve), then press Space once. Wait for Async initial without fallback. The heading is the only mouse click allowed; do not click Resolve or the tightly joined row text.
      - aiAssert: The asynchronous row with Update and Resolve displays Async initial without fallback.
      - aiAct: Click the large BrowserOnly section heading in the main article to reset the keyboard navigation starting point. Press Tab three times to focus Update, then Space once. Press Tab once to focus Resolve and Space once to finish the pending update. The heading is the only mouse click allowed; do not click Update, Resolve or the tightly joined row text. Wait for Async updated without fallback. Async fallback updated is still pending and is not success.
      - aiAssert: The asynchronous row with Update and Resolve displays Async updated without fallback, rather than Async initial.
