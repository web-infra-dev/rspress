      - aiAssert: 'The multiple-args panel displays "npx skills add rstackjs/agent-skills --skill migrate-to-rstest". Each of these panels offers the tabs npm, yarn, pnpm, bun, and deno in that order, with npm selected.'
      - aiAct: 'Scroll to the final PackageManagerTabs exec and PackageManagerTabs with custom object panels so both commands are visible. Do not click any tabs.'
      - aiAssert: 'The exec panel displays "npx example-cli-tool --yes" and the custom-object panel displays "npm create rspress@latest". Each of these panels offers the tabs npm, yarn, pnpm, bun, and deno in that order, with npm selected.'
