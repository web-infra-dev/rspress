      - aiAct: 'Select deno in the PackageManagerTabs create panel near the top of the article. Bring the create and install panels into view together. Do not select tabs in any other panel.'
      - aiAssert: 'The create panel displays the command "deno init --npm rspress@latest" and the install panel displays "deno add -D npm:@rspress/core". Each of these panels offers the tabs npm, yarn, pnpm, bun, and deno in that order, with deno selected.'
      - aiAct: 'Scroll to the PackageManagerTabs dlx panel, the example using example-cli-tool. Do not click any tabs.'
