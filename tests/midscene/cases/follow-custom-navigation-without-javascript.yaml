cases:
  - name: STATIC-01 Follow custom navigation without JavaScript
    tags:
      [
        original-static,
        replacement-batch-3-slots,
        remote-search-static-regression,
      ]
    steps:
      - app.open:
          { fixture: nav-slots, mode: production, javascript: false, path: / }
      - aiAssert:
          prompt: The custom navigation links BL, AL, BR, and AR are visible.
          options: { domIncluded: visible-only }
      - aiHover: The More dropdown trigger in the top navigation.
      - aiAssert: The open More dropdown contains a visible Target link.
      - aiTap: The Target link inside the open More dropdown.
      - app.expectLocation: { path: /target, heading: Target }
      - aiAssert: The Target article is visible.
