cases:
  - name: STYLE-01 Read styled Tailwind content
    tags: [original-style]
    steps:
      - app.open: { fixture: tailwind-v4, path: / }
      - aiAct: Bring the Red Text, Bold Text, and Blue Box examples into view.
      - aiAssert: Red Text is red, Bold Text appears bold, and Blue Box has a blue background with readable white text.
  - name: STYLE-02 Read the themed documentation link
    tags: [original-style]
    steps:
      - app.open: { fixture: theme-css, path: / }
      - aiAct: Find the link in the documentation article and bring it into view.
      - aiAssert: The article link is visibly orange.
  - name: STYLE-03 Read highlighted code differences
    tags: [original-code]
    steps:
      - app.open: { fixture: code-block, path: / }
      - aiAct: Bring the first diff-highlighted code example in transformers into view.
      - aiAssert: The Diff remove line is marked as removed and the Diff add line is marked as added with distinct highlighting.
  - name: STYLE-04 Read Markdown warning callouts
    tags: [original-callout]
    steps:
      - app.open: { fixture: github-alert-mdxjs, path: / }
      - aiAct: Find the Warning callout in the article and bring it into view.
      - aiAssert: A Warning callout is visible with its warning text and distinct warning styling.
  - name: STYLE-05 Read the runtime code block title and content
    tags: [original-runtime-code, ci-regression]
    steps:
      - app.open: { fixture: code-block-runtime, path: / }
      - aiAct: Bring the first code panel titled test.js into view. Read the rendered code inside that panel; do not use search or navigate to another page.
      - aiAssert: The runtime code panel displays console.log with Hello CodeBlock content as rendered code, not a blank panel.
