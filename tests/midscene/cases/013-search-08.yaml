cases:
  - name: SEARCH-08 Find Japanese content
    tags:
      [
        original-localized-search,
        replacement-batch-3,
        remote-search-static-regression,
        remote-japanese-regression,
      ]
    steps:
      - app.open: { fixture: search-i18n, path: / }
      - aiAct: Switch the site language to 日本語 using the language menu, then open search and enter ご.
      - aiAssert: The search input contains ご (hiragana go). Exactly one result row is listed, with the Japanese page title beginning にほんご and ending ページ. Read the title as a whole; matching characters may be underlined or the entire row may be selected in blue.
      - aiAct: Replace the search query with ヘッダー. Stay in the search dialog.
      - aiAssert: Exactly two search results are listed and the first contains ヘッダー.
      - aiAct: Replace the search query with す. Stay in the search dialog.
      - aiAssert: The search dialog shows exactly one result row. Its main title reads できます (de-ki-ma-su), with す highlighted at the end. The smaller line beneath the title is its page breadcrumb, not a second result.
      - aiAct: Select all text in the search input and replace it with the literal character さ (hiragana sa, not す which is su). Perform the replacement even if the current character looks similar; do not treat the existing input as already correct. Keep the dialog open and wait for its results to update.
      - aiAssert: Exactly one search result row is listed. Its long Japanese title wraps across lines and ends with the two characters さい (hiragana sa followed by i). Check the end of the title above the smaller page breadcrumb.
