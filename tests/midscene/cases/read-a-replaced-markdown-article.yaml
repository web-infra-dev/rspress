cases:
  - name: READ-05 Read a replaced Markdown article
    tags: [original-replacement, replacement-batch-3]
    steps:
      - app.open: { fixture: replace-rules, path: / }
      - aiAct: Use documentation search to find bar-content and open its result in the article titled bar-title. Stay on that article when the bar-content paragraph and bar-h2 heading are visible. The sidebar child named content is a different page; do not open it or follow a next-page link.
      - aiAssert: The article contains bar-content and the heading bar-h2.
