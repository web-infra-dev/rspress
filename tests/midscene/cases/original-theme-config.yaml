cases:
  - name: THEME-01 Read dark-default documentation on a light-preference device
    tags: [original-theme-config]
    steps:
      - app.open: { fixture: basic-dark, path: /, colorScheme: light }
      - aiAct: Bring the Hello world article and its top appearance switch into view. Do not change the theme yet.
      - aiAssert: The page initially uses a dark reading theme and displays an appearance switch.
      - aiAct: Use the appearance switch to change the page to light mode.
      - aiAssert: The article uses a light background with readable dark text.
  - name: THEME-02 Forced dark documentation ignores a saved light preference
    tags: [original-theme-config]
    steps:
      - app.open:
          {
            fixture: basic-force-dark,
            path: /,
            colorScheme: light,
            savedAppearance: light,
          }
      - aiAct: Bring the Hello world article and top navigation into view. Stay on the article.
      - aiAssert: The page uses a dark reading theme and does not offer an appearance switch in the top navigation.
  - name: THEME-03 System-aware documentation starts with the device preference
    tags: [original-theme-config]
    steps:
      - app.open: { fixture: basic-system, path: /, colorScheme: dark }
      - aiAct: Bring the Hello world article and its top appearance switch into view. Do not change the theme yet.
      - aiAssert: The page initially uses the device's dark reading theme and displays an appearance switch.
      - aiAct: Use the appearance switch to change the page to light mode.
      - aiAssert: The article uses a light reading theme.
