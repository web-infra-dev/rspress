cases:
  - name: PREVIEW-04 Read iframe previews in development
    tags: [original-preview-render, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-preview, path: / }
      - aiAct: Stay on Guide and read the fixed device preview on the right. It renders three short lines of static demo output, not navigation links. Bring those rendered lines into view without clicking their text, navigating, or reading only the source code.
      - aiAssert: Below Guide in the right-hand device frame, black text includes Hello World Internal, Hello World External, and Render from JSON. These three lines are in the preview, not in the colored source code on the left.
  - name: PREVIEW-05 Read iframe previews in a production build
    tags: [original-preview-render, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-preview, mode: production, path: / }
      - aiAct: Stay on Guide and read the fixed device preview on the right. It renders three short lines of static demo output, not navigation links. Bring those rendered lines into view without clicking their text, navigating, or reading only the source code.
      - aiAssert: Below Guide in the right-hand device frame, black text includes Hello World Internal, Hello World External, and Render from JSON. These three lines are in the preview, not in the colored source code on the left.
  - name: PREVIEW-06 Read custom JSX and TSX entry previews
    tags:
      [
        original-preview-render,
        replacement-batch-4,
        replacement-preview-prompt,
        remote-preview-virtual-regression,
      ]
    steps:
      - app.open: { fixture: plugin-preview-custom-entry, path: /guide/ }
      - aiAssert: The first example's right gray preview pane displays a black Hello World JSX line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
      - aiAct: Scroll the Guide article to the second example showing Hello World TSX. Stay on this article.
      - aiAssert: The second example's right gray preview pane displays a black Hello World TSX line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
      - aiAct: Scroll the Guide article to the third example showing Hello World External. Stay on this article.
      - aiAssert: The third example's right gray preview pane displays a black Hello World External line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
  - name: PREVIEW-07 Read mixed internal and iframe previews
    tags: [original-preview-render, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-preview, path: /mixed }
      - aiAssert: On Mixed, the first standalone internal preview in the main article shows plain This is a component outside its source code. Separately, the floating phone on the far right shows both This is a component and Hello World External below Mixed.
      - aiAct: Scroll the outer Mixed document down slightly to show the first side-by-side example with colored Component source on the left and plain This is a component in the gray preview pane on the right. Stop when that output text is readable. Keep the pointer over the article margin, outside code editors and the floating phone. Do not click any example or navigate away.
      - aiAssert: In the main article, black This is a component text is visible in a preview pane beside colored source code. This pane is separate from the floating phone on the far right.
      - aiAct: Continue down the outer article to the External file section. Show its standalone Hello World External preview and the beginning of the side-by-side example below it, where the gray right pane also displays Hello World External. Position both output lines inside the viewport. Scroll over the article margin, not inside the source editor or floating phone. Stop without clicking an example or navigating away.
      - aiAssert: In the main article's External file section, the standalone internal preview shows Hello World External. Below it, the gray iframe pane beside the colored HelloWorld source also shows Hello World External. Both are rendered plain output, separate from source code and the floating phone.
