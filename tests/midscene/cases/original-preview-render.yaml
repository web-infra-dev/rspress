cases:
  - name: PREVIEW-04 Read iframe previews in development
    tags: [original-preview-render, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-preview, path: / }
      - aiAct: Stay on Guide and read the fixed device preview on the right. It renders three short lines of static demo output, not navigation links. Bring those rendered lines into view without clicking their text, navigating, or reading only the source code.
      - aiAssert: Below Guide in the right-hand device frame, black text includes Hello World Internal, Hello World External, and Render from JSON. These three lines are in the preview, not in the colored source code on the left.
  - name: PREVIEW-05 Read iframe previews in a production build
    tags: [original-preview-render, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-preview, mode: production, path: / }
      - aiAct: Stay on Guide and read the fixed device preview on the right. It renders three short lines of static demo output, not navigation links. Bring those rendered lines into view without clicking their text, navigating, or reading only the source code.
      - aiAssert: Below Guide in the right-hand device frame, black text includes Hello World Internal, Hello World External, and Render from JSON. These three lines are in the preview, not in the colored source code on the left.
  - name: PREVIEW-06 Read custom JSX and TSX entry previews
    tags:
      [
        original-preview-render,
        replacement-batch-4,
        replacement-preview-prompt,
        remote-preview-virtual-regression,
      ]
    steps:
      - app.open: { fixture: plugin-preview-custom-entry, path: /guide/ }
      - aiAssert: The first example's right gray preview pane displays a black Hello World JSX line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
      - aiAct: Scroll the Guide article to the second example showing Hello World TSX. Stay on this article.
      - aiAssert: The second example's right gray preview pane displays a black Hello World TSX line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
      - aiAct: Scroll the Guide article to the third example showing Hello World External. Stay on this article.
      - aiAssert: The third example's right gray preview pane displays a black Hello World External line along its upper edge, to the right of the colored source code. Documentation navigation is still visible.
  - name: PREVIEW-07 Read mixed internal and iframe previews
    tags: [original-preview-render, replacement-batch-4]
    steps:
      - app.open: { fixture: plugin-preview, path: /mixed }
      - aiAct: Inspect the floating phone on the far right while the outer document stays at the top of Mixed. If necessary scroll inside that phone to see its plain This is a component and Hello World External text. Stop when both are visible. Do not click text or toolbar controls.
      - aiAssert: In the floating phone on the far right, black text below Mixed includes This is a component and Hello World External, separate from source code in the main article.
      - aiAct: Stay on Mixed and bring the first rendered inline component preview into view, not merely its source code.
      - aiAssert: The rendered internal preview displays This is a component.
      - aiAct: Continue down the outer document on Mixed, staying above the External file section. Find the first side-by-side row with colored Component source code on the left and plain This is a component text in its inline pane on the right, immediately left of the floating phone. Stop when that plain text is visible; the whole pane does not need to fit on screen. Do not scroll inside the editor or phone, and do not click text, toolbar, or navigation.
      - aiAssert: In the main article, black This is a component text is visible in a preview pane beside colored source code. This pane is separate from the floating phone on the far right.
      - aiAct: Continue down to the External file section of the main article. Bring its first rendered inline internal preview into view. Read its plain Hello World External output, not its source code or the floating phone.
      - aiAssert: Under the External file heading in the main article, the rendered preview shows plain Hello World External text outside source code. The earlier This is a component preview belongs to a different section; the floating phone is also a separate preview.
      - aiAct: Scroll only the outer document on Mixed to the row with a colored HelloWorld source editor on the left and plain Hello World External text on the right. The plain text sits at the top of the inline pane, immediately left of the floating phone. Stop as soon as this plain text is visible; the whole pane does not need to fit on screen. Do not click the text, toolbar, or navigation, and do not scroll inside the phone or editor.
      - aiAssert: That main-article iframe preview displays Hello World External.
