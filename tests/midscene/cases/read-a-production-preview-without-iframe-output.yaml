cases:
  - name: AUDIT-05 Read a production preview without iframe output
    tags: [replacement-final-content]
    steps:
      - app.open:
          { fixture: plugin-preview-no-iframe, mode: production, path: / }
      - aiWaitFor: The Internal only page shows a preview card containing the plain text Internal preview only.
      - aiAssert: Inside the preview card, the rendered output reads Internal preview only as ordinary text outside any syntax-highlighted source code. If source code is also expanded below it, the rendered output above still satisfies this check.
