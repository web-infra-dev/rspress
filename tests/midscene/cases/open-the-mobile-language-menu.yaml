cases:
  - name: AUDIT-08 Open the mobile language menu
    tags: [replacement-final-content]
    steps:
      - app.open: { fixture: i18n, path: /, viewport: mobile }
      - aiTap: The hamburger navigation menu button at the top right.
      - aiWaitFor: The mobile navigation menu shows the Guide, Api, and 语言 rows.
      - aiTap: The 语言 row showing 简体中文 and a right-facing expansion arrow. Tap the row once to expand the language choices.
      - aiWaitFor: English is visible below the 语言 row, alongside the current 简体中文 choice.
      - aiAssert: The mobile menu is visible and its language choices show current language 简体中文 and alternative English.
