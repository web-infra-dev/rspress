cases:
  - name: ASSET-03 Read public assets from markdown-link-asset-clean English documentation
    tags: [replacement-final-assets]
    steps:
      - app.open:
          {
            fixture: markdown-link-asset-clean,
            mode: production,
            path: /base/public-asset-test,
          }
      - aiAssert: The Public asset test article displays six links including svg in public folder, txt in public folder, html in public folder, md in public folder, and two interface.DataProcessorDefinition links.
      - aiAct: Follow txt in public folder.
      - aiAssert: The opened text document displays Plain Text.
      - aiAct: Go back to the Public asset test article. Click the link labeled html in public folder, above md in public folder; do not click the Markdown link. Wait for the HTML page with the Hello world heading. If the opened page shows # Test, that is the Markdown asset, so go back and choose the HTML link instead.
      - aiAssert: The opened HTML document displays Hello world as its heading.
      - aiAct: Go back to the Public asset test article, then follow md in public folder.
      - aiAssert: The opened raw Markdown document displays the literal text # Test.
