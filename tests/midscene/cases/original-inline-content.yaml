cases:
  - name: INLINE-01 Read formatted sidebar labels
    tags: [replacement-final-inline]
    steps:
      - app.open: { fixture: inline-markdown, path: /inline/index }
      - aiAct: Bring the upper portion of the left sidebar into view, keeping this overview page open.
      - aiAssert: The sidebar starts with Overview, two Class Component<P, S> entries, then bold, emphasis, <foo>, and -m <number> in that order. Angle brackets appear as text rather than disappearing.
      - aiAct: Scroll within the left sidebar to bring its lower entries starting from delete into view. Do not navigate.
      - aiAssert: Starting at delete, five consecutive sidebar entries read delete, link, Class Component<P = { }, S = { }, SS = any>, Class Foo<T = { }>, and Class Bar<T = any> in that order. Earlier sidebar entries such as -m <number> may also remain visible above delete. The generic type text is readable.
  - name: INLINE-02 Read formatted article outline entries
    tags: [replacement-final-inline, remote-inline-virtual-regression]
    steps:
      - app.open: { fixture: inline-markdown, path: /inline/all }
      - aiAct: Bring the upper entries of the right On this page outline into view. Focus on the outline, not the left sidebar.
      - aiAssert: The outline starts with two Class Component<P, S> entries, -m <number>, <foo>, foo <bar> baz, and bold in order.
      - aiAct: Scroll within the right On this page outline if needed to reveal its lower entries without navigating away.
      - aiAssert: In the right On this page outline, emphasis is directly above delete. Below delete are This is a long string to test regex performance, Class Bar<T = any>, **literal**, and &lt;, in that top-to-bottom order. The last two entries visibly retain the literal asterisks and the four characters ampersand, l, t, semicolon.
  - name: INLINE-03 Read escaped overview groups and entries
    tags: [replacement-final-inline, remote-regression]
    steps:
      - app.open: { fixture: inline-markdown, path: /inline/index }
      - aiAct: Bring the beginning of the central overview into view, ignoring duplicate labels in the sidebars.
      - aiAssert: The overview begins with two groups titled Class Component<P, S>. Each group's own card title reads Class Component<P, S>.
      - aiAct: Scroll only the central overview to show the bold group heading and its entire card. Do not follow any link.
      - aiAssert: The group headed bold contains a card titled bold. Both labels are readable text, not raw HTML tags.
      - aiAct: Scroll only the central overview to show the emphasis group heading and its entire card. Do not follow any link.
      - aiAssert: The group headed emphasis contains a card titled emphasis. Both labels are readable text, not raw HTML tags.
      - aiAct: Scroll the central overview to the <foo> and -m <number> groups.
      - aiAssert: The group headed <foo> contains a card titled <foo>. The separate group headed -m <number> contains a card titled -m <number>. Both preserve the angle brackets.
      - aiAct: Scroll the central overview to the delete and link groups.
      - aiAssert: The group headed delete contains a card titled delete. The separate group headed link contains a card titled link.
      - aiAct: Scroll only the main document to the generic Class Component group below the link group. Show its heading and card together, then stop. Do not click any links or try to fit later groups on screen.
      - aiAssert: Below the link group, the generic group heading reads Class Component<P = { }, S = { }, SS = any>. Its card repeats the same generic type text.
      - aiAct: Continue down the main overview to the next group, Class Foo. Show its heading and card together, then stop without clicking any link.
      - aiAssert: The next group heading reads Class Foo<T = { }>, and its card repeats the same generic type text.
      - aiAct: Continue down the main overview to the final group, Class Bar. Show its heading and card together, then stop without clicking any link.
      - aiAssert: The final group heading reads Class Bar<T = any>, and its card repeats the same generic type text.
  - name: INLINE-04 Read all escaped overview article links
    tags:
      [replacement-final-inline, replacement-final-followup, remote-regression]
    steps:
      - app.open: { fixture: inline-markdown, path: /inline/index }
      - aiAct: Bring the first central overview group titled Class Component<P, S> into view. Focus on its article links, not sidebar entries or the later overview groups.
      - aiAssert: Within the first wide overview card, ignore its gray title panel on the left and the page sidebar. The white article-link area to the right contains two Class Component<P, S> links and the links -m <number>, <foo>, foo <bar> baz, bold, emphasis, delete, This is a long string to test regex performance, Class Bar<T = any>, **literal**, and &lt;, in that reading order. Wrapped text still belongs to one link.
      - aiAct: Scroll the central overview to the group named link and bring its four article links into view.
      - aiAssert: The group lists this is link rsbuild, this is bold link rsbuild, this is code link rsbuild, and this is bold code link rsbuild in order. Formatting does not remove any words.
