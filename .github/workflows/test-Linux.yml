name: Test (Linux)

concurrency:
  group: linux-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  ut-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        # Manual runs leave the output unset; only 'false' skips later steps.
        if: github.event_name != 'workflow_dispatch'
        with:
          token: ''
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters.yml

      - name: Setup Node.js
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Pnpm
        if: steps.changes.outputs.changed != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Dependencies
        if: steps.changes.outputs.changed != 'false'
        run: pnpm install --ignore-scripts

      - name: Build Packages
        if: steps.changes.outputs.changed != 'false'
        run: pnpm run build

      - name: Build Website
        if: steps.changes.outputs.changed != 'false'
        run: pnpm --filter @rspress/docs run build

      # WebMCP tests use bundled Chromium on Linux.
      - name: Install Playwright Browsers
        if: steps.changes.outputs.changed != 'false'
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit Test
        if: steps.changes.outputs.changed != 'false'
        run: pnpm run test:unit

      - name: E2E Test
        if: steps.changes.outputs.changed != 'false'
        run: pnpm run test:e2e

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: rstest-playwright-traces
          path: .rstest/playwright-traces/
          if-no-files-found: ignore
          retention-days: 14
