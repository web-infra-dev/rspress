name: Test (Linux)

concurrency:
  group: linux-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ut-linux:
    # The type of runner that the job will run in
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Check skip CI
        run: echo "RESULT=$(node ./scripts/skipCI.js)" >> "$GITHUB_OUTPUT"
        id: skip-ci

      - name: Log skip CI result
        run: echo "${{steps.skip-ci.outputs.RESULT}}"

      - name: Setup Node.js
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Nx Cache
        id: nx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .nx/cache
          key: nx-${{ github.ref_name }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ github.ref_name }}-${{ runner.os }}

      - name: Install Dependencies
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm install --ignore-scripts

      - name: Build Packages
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm run build

      - name: Build Website # for test
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm run build:website

      # Ubuntu runners ship without the browser binaries Playwright needs
      - name: Install Playwright Browsers
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit Test
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm run test:unit

      - name: E2E Test
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm run test:e2e

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rstest-playwright-traces
          path: .rstest/playwright-traces/
          if-no-files-found: ignore
          retention-days: 14
