name: Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions: {}

jobs:
  Build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pnpm
        run: |
          npm install -g corepack@latest --force
          corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install Dependencies and Build
        run: |
          pnpm install

      - name: Build Website Project
        run: RSDOCTOR=1 pnpm --filter @rspress/docs run build

      - name: Build New Project
        run: RSDOCTOR=1 pnpm --filter @rspress-fixture/auto-nav-sidebar run build

      - name: Report Compressed Size
        uses: web-infra-dev/rsdoctor-action@d5bda00d0d6e966f75130e0634502ce63dc7b9d8 # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_path: '{website,e2e/fixtures/auto-nav-sidebar}/doc_build/diff-rsdoctor/**/rsdoctor-data.json'
          target_branch: 'main'
