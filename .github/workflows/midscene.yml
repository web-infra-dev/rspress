name: E2E Testing by Midscene

# AI-native visual E2E against original repository fixtures and local smoke pages.
# Model credentials are scoped to verification and case execution.

on:
  push:
    branches: [main, benchmark/midscene-speed-20261022]
    paths:
      [
        'packages/**',
        'e2e/**',
        'tests/midscene/**',
        '.github/workflows/midscene.yml',
        'pnpm-lock.yaml',
      ]
  workflow_dispatch:
    inputs:
      file_concurrency:
        description: Concurrent cases in the regular E2E run (with Pages reports)
        type: choice
        options: ['1', '5', '10', '15', '20', '30', '40', '60']
        default: '40'
      request_retry_interval:
        description: Model retry delay in milliseconds (65000 for minute-based quota limits)
        type: choice
        options: ['2000', '65000']
        default: '2000'
      publish_pages:
        description: Publish reports to GitHub Pages
        required: false
        type: boolean
        default: true

# Model runs use upstream main, the owner's benchmark branch, or manual dispatch.
# Pages publication defaults on; manual runs can disable it.

permissions:
  contents: read

# Model execution and Pages publication use separate job-level locks.

env:
  MIDSCENE_UPSTREAM_REPOSITORY: web-infra-dev/rspress

jobs:
  fixture-windows:
    name: Validate fixture cleanup on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --test scripts/fixture-server.test.mjs
        working-directory: tests/midscene

  midscene:
    name: Midscene E2E
    outputs:
      report-artifact-name: ${{ steps.midscene-test.outputs.report-artifact-name }}
    concurrency:
      group: midscene-model-execution
      cancel-in-progress: false
    environment:
      name: Model
      deployment: false
    if: >-
      (github.repository == 'web-infra-dev/rspress' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'push' && github.repository == 'quanru/rspress' && github.ref == 'refs/heads/benchmark/midscene-speed-20261022') ||
      (github.event_name == 'workflow_dispatch' && github.repository != 'web-infra-dev/rspress'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HEADLESS: 'true'
      MIDSCENE_FILE_CONCURRENCY: ${{ inputs.file_concurrency || '40' }}
      # Request and output-format retries share this delay; case retries stay off.
      MIDSCENE_MODEL_TIMEOUT: '120000'
      MIDSCENE_MODEL_RETRY_COUNT: '4'
      MIDSCENE_MODEL_RETRY_INTERVAL: ${{ inputs.request_retry_interval || '2000' }}
      # The model endpoint is reachable over IPv4; avoid family-race timeouts.
      NODE_OPTIONS: '--dns-result-order=ipv4first --no-network-family-autoselection'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm must exist before setup-node resolves the pnpm store for its
      # cache; without a version it reads the root `packageManager` field.
      - name: Enable pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Activate Node.js 24 and pnpm
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies without developer hooks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild sharp

      - name: Fingerprint committed build inputs
        id: build-inputs
        run: node tests/midscene/scripts/build-fingerprint.mjs

      - name: Restore workspace build
        id: workspace-build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            packages/*/dist
            packages/create-rspress/template-basic-theme
            packages/create-rspress/template-i18n-theme
          key: midscene-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.build-inputs.outputs.fingerprint }}

      - name: Build checked-out packages on cache miss
        if: steps.workspace-build.outputs.cache-hit != 'true'
        run: pnpm run build

      - name: Save workspace build
        if: steps.workspace-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            packages/*/dist
            packages/create-rspress/template-basic-theme
            packages/create-rspress/template-i18n-theme
          key: ${{ steps.workspace-build.outputs.cache-primary-key }}

      - name: Restore npm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene test dependencies
        # allowScripts for esbuild/sharp is declared in this package.json, so
        # npm install runs their (approved) install scripts non-interactively.
        working-directory: tests/midscene
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate fixture support before model access
        working-directory: tests/midscene
        run: npm run typecheck && npm run test:fixtures

      - name: Verify Midscene model compatibility
        working-directory: tests/midscene
        # Only model verification and case execution receive model credentials.
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_MODEL_REASONING_ENABLED: ${{ vars.MIDSCENE_MODEL_REASONING_ENABLED || secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
        run: npm run check:model

      - name: Run all Midscene cases
        id: midscene-test
        uses: web-infra-dev/midscene-action@5ef922b20a69d69a0f34639c4c867ba2049f6ede # v1
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_MODEL_REASONING_ENABLED: ${{ vars.MIDSCENE_MODEL_REASONING_ENABLED || secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: '40'
          MIDSCENE_RETRY: '0'
        with:
          working-directory: tests/midscene
          command: timeout --signal=TERM --kill-after=10s 220m npx midscene-test
          artifact-name: midscene-results
          retention-days: '14'
          # Keep the existing GitHub Pages site and per-case screenshot table.
          publish-pages: false

  publish-pages:
    name: Publish Midscene Pages report
    concurrency:
      group: midscene-pages-publication
      cancel-in-progress: false
    needs: midscene
    if: >-
      always() && !cancelled() &&
      vars.MIDSCENE_PUBLISH_REPO == github.repository &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_pages) &&
      needs.midscene.outputs.report-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.report.outputs.page-url }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # Shared Pages support is proposed upstream; pin the reviewed fork commit.
      - id: report
        uses: quanru/midscene-action-upstream/pages@b0b2fe13eac26c75327a4cf322865fcd98c9c0f4
        with:
          artifact-name: ${{ needs.midscene.outputs.report-artifact-name }}
          producer-result: ${{ needs.midscene.result }}
          history-branches: main,test/midscene-e2e,ci/midscene-action,benchmark/midscene-speed-20261022
