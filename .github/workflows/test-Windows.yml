name: Test (Windows)

concurrency:
  group: windows-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  ut-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Enable Long Paths
        shell: bash
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Skip detection needs the merge base with origin/main.
          fetch-depth: 0

      - name: Check skip CI
        id: skip-ci
        shell: bash
        run: |
          result=$(node ./scripts/skipCI.js)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Skip CI: $result"

      - name: Setup Node.js
        if: steps.skip-ci.outputs.result != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Pnpm
        if: steps.skip-ci.outputs.result != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Dependencies
        if: steps.skip-ci.outputs.result != 'true'
        run: pnpm install --ignore-scripts

      - name: Build Packages
        if: steps.skip-ci.outputs.result != 'true'
        run: pnpm run build

      - name: Build Website
        if: steps.skip-ci.outputs.result != 'true'
        run: pnpm --filter @rspress/docs run build

      - name: Unit Test
        if: steps.skip-ci.outputs.result != 'true'
        run: pnpm run test:unit

      - name: E2E Test
        if: steps.skip-ci.outputs.result != 'true'
        run: pnpm run test:e2e

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rstest-playwright-traces
          path: .rstest/playwright-traces/
          if-no-files-found: ignore
          retention-days: 14
