packages:
  - scripts/config
  - packages/*
  - e2e/**
  - website
  - '!**/compiled/**'
  - '!**/tests/**'
  - '!packages/create-rspress/template-*'

allowBuilds:
  sharp: true

hoistPattern: []

linkWorkspacePackages: true

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - rsbuild-plugin-dts
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstack-dev/*'
  - '@rstackjs/create-toolkit'
  - rstack
  - heading-case
  # Renovate security update: tinypool@2.1.2
  - tinypool@2.1.2

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
