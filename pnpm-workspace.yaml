packages:
  - tests/midscene
  - scripts/config
  - packages/*
  - e2e/**
  - website
  - '!**/compiled/**'
  - '!packages/**/tests/**'
  - '!e2e/**/tests/**'
  - '!packages/create-rspress/template-*'

allowBuilds:
  esbuild: true
  sharp: true

hoistPattern: []

linkWorkspacePackages: true

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@rstackjs/cli-darwin-x64@0.9.3'
  - '@rstackjs/cli-darwin-arm64@0.9.3'
  - '@rstackjs/cli-linux-x64-gnu@0.9.3'
  - '@rstackjs/cli-linux-x64-musl@0.9.3'
  - '@rstackjs/cli-win32-x64-msvc@0.9.3'
  - '@rstackjs/cli-linux-arm64-gnu@0.9.3'
  - '@rstackjs/cli-linux-ppc64-gnu@0.9.3'
  - '@rstackjs/cli-linux-s390x-gnu@0.9.3'
  - '@rstackjs/cli-win32-ia32-msvc@0.9.3'
  - '@rstackjs/cli-linux-arm64-musl@0.9.3'
  - '@rstackjs/cli-win32-arm64-msvc@0.9.3'
  - '@rstackjs/cli-linux-riscv64-gnu@0.9.3'
  - '@rstackjs/cli-linux-riscv64-musl@0.9.3'
  - '@swc-next/*'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - rsbuild-plugin-dts
  # Reviewed loading strategy option: rstackjs/rsbuild-plugin-google-analytics#82
  - rsbuild-plugin-google-analytics@1.1.0
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstack-dev/*'
  - '@rstackjs/create-toolkit'
  - rstack
  - heading-case
  # Renovate security update: tinypool@2.1.2
  - tinypool@2.1.2

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
