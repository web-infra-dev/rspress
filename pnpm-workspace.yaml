packages:
  - tests/midscene
  - scripts/config
  - packages/*
  - e2e/**
  - website
  - '!**/compiled/**'
  - '!packages/**/tests/**'
  - '!e2e/**/tests/**'
  - '!packages/create-rspress/template-*'

permissions:
  '@rstackjs/maintainer-skills':
    skills:
      - create-draft-release-notes
      - pr-creator
      - rstack-docs-writer
  '@rstackjs/skills':
    skills:
      - rspress-best-practices
      - rspress-custom-theme
      - rspress-description-generator
      - rspress-docs-generator
  rstack:
    skills:
      - rstack-cli-docs

allowBuilds:
  esbuild: true
  sharp: true

hoistPattern: []

linkWorkspacePackages: true

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
# Keep this allowlist at the package level; do not add package@version entries.
# Add packages directly maintained by the Rstack team only as needed,
# rather than adding them all at once.
minimumReleaseAgeExclude:
  - '@swc-next/*'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - rsbuild-plugin-dts
  # Reviewed loading strategy option: rstackjs/rsbuild-plugin-google-analytics#82
  - rsbuild-plugin-google-analytics@1.1.0
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstack-dev/*'
  - '@rstackjs/*'
  - rstack
  - heading-case
  - react-render-to-markdown

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
